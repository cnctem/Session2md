[package]
name = "session2md"
version = "3.20.0"
description = "Read local AI sessions and export conversations as Markdown"
authors = ["Jason Young"]
license = "MIT"
repository = "https://github.com/farion1231/session2md"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "session2md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
log = "0.4"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tauri = { version = "2.8.2", features = ["image-png"] }
tauri-plugin-dialog = "2"
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.1", features = ["v2_16"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"

[dev-dependencies]
tempfile = "3"
